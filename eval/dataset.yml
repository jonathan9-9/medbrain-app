# Evaluation dataset for the clinical ops document Q&A system.
#
# Categories:
#   standard                - single-document factual questions
#   multi_doc_synthesis     - requires combining info from 2+ documents
#   unanswerable             - not covered by the corpus at all
#   medical_advice_refusal   - personal medical advice; must be refused
#
# expected_source_doc_ids: doc_id values (from corpus frontmatter) that a
# correct retrieval should surface. Empty for unanswerable/refusal cases,
# since a correct system either finds nothing relevant or never reaches
# retrieval (medical-advice gate fires first).
#
# expected_answer_summary: a short gold summary I wrote by hand, used by
# the LLM judge to check correctness -- NOT meant to be matched verbatim.

- id: q01
  category: standard
  question: "What two identifiers must staff use to verify a patient's identity before giving a medication?"
  expected_source_doc_ids: ["SOP-PS-002"]
  expected_answer_summary: >
    Staff must use at least two identifiers -- full legal name and either
    date of birth or medical record number -- and a room/bed number is
    never acceptable as an identifier.

- id: q02
  category: standard
  question: "What temperature range should refrigerated vaccines be kept at?"
  expected_source_doc_ids: ["SOP-IZ-006"]
  expected_answer_summary: >
    Refrigerated vaccines must be stored between 2°C and 8°C (36°F-46°F),
    and never in a dormitory-style fridge or in the unit's door.

- id: q03
  category: standard
  question: "How soon after a hospital discharge should a follow-up visit be scheduled, and how soon should a telephone check-in happen?"
  expected_source_doc_ids: ["SOP-CO-014"]
  expected_answer_summary: >
    Care coordinators should attempt to schedule a follow-up visit within
    7 days of hospital discharge and complete a telephone check-in within
    48 hours to review medications and warning signs.

- id: q04
  category: standard
  question: "What vital sign thresholds trigger the outpatient sepsis screening escalation pathway?"
  expected_source_doc_ids: ["SOP-CL-011"]
  expected_answer_summary: >
    In a patient with suspected infection, two or more of: heart rate over
    100 bpm, respiratory rate over 20/min, systolic BP under 100 mmHg, new
    confusion, or temperature over 38.3°C or under 36°C should trigger
    escalation.

- id: q05
  category: standard
  question: "Within how many hours must a serious adverse event be reported to the IRB and sponsor?"
  expected_source_doc_ids: ["SOP-CR-004"]
  expected_answer_summary: >
    Serious adverse events must be reported to the IRB and sponsor within
    24 hours of the site becoming aware of them.

- id: q06
  category: standard
  question: "How long should staff rub an alcohol-based hand sanitizer into their hands?"
  expected_source_doc_ids: ["SOP-IC-001"]
  expected_answer_summary: >
    Alcohol-based hand rub should be applied and rubbed over all surfaces
    of the hands and fingers until dry, for a minimum of 20 seconds.

- id: q07
  category: standard
  question: "What is the correct order for removing (doffing) PPE?"
  expected_source_doc_ids: ["SOP-IC-004"]
  expected_answer_summary: >
    Gloves are removed first, then hand hygiene, then the gown (rolled
    inward), then hand hygiene again, then eye protection, then the room
    is exited, then the mask/respirator is removed by ties/ear loops, then
    a final hand hygiene.

- id: q08
  category: standard
  question: "How many emergency response drills is each site required to run per year?"
  expected_source_doc_ids: ["POL-EM-008"]
  expected_answer_summary: >
    Each site must conduct at least two documented emergency response
    drills per year.

- id: q09
  category: standard
  question: "What are the three zones used in an asthma action plan?"
  expected_source_doc_ids: ["PED-AST-003"]
  expected_answer_summary: >
    Green zone (doing well, continue regular controller medication),
    yellow zone (caution, increasing symptoms, temporary medication
    change per the written plan), and red zone (medical alert, severe
    symptoms requiring urgent action).

- id: q10
  category: standard
  question: "What must staff do if a controlled substance inventory count doesn't match the log?"
  expected_source_doc_ids: ["POL-MED-012"]
  expected_answer_summary: >
    Any discrepancy must be reported to the site clinical lead and the
    DEA-registered provider on the same day it is discovered.

- id: q11
  category: multi_doc_synthesis
  question: >
    A patient is being discharged from the hospital back to our care --
    what do we need to do for both their overall discharge/transition
    planning and their medication list, and on what timelines?
  expected_source_doc_ids: ["SOP-CO-014", "SOP-MED-003"]
  expected_answer_summary: >
    Discharge planning requires a written summary (diagnosis, meds,
    pending results, follow-up, warning signs) finalized within 3
    business days, a follow-up visit within 7 days, and a telephone
    check-in within 48 hours (SOP-CO-014). Separately, medication
    reconciliation must be performed at this transition -- comparing the
    patient-reported list to the EHR, resolving discrepancies with the
    prescriber, and documenting the reconciled list (SOP-MED-003).

- id: q12
  category: multi_doc_synthesis
  question: >
    What hand hygiene and environmental cleaning steps are required
    between patients in an outpatient exam room?
  expected_source_doc_ids: ["SOP-IC-001", "SOP-IC-006"]
  expected_answer_summary: >
    Hand hygiene must be performed before and after touching the patient
    and their surroundings, using alcohol-based rub or soap and water as
    appropriate (SOP-IC-001). Separately, exam room surfaces must be
    cleaned and disinfected with an EPA-registered disinfectant between
    every patient, following the required contact/dwell time (SOP-IC-006).

- id: q13
  category: multi_doc_synthesis
  question: >
    What's the difference between general clinical informed consent and
    informed consent for a research study, in terms of who can obtain it
    and what has to be documented?
  expected_source_doc_ids: ["POL-CO-010", "SOP-CR-001"]
  expected_answer_summary: >
    General clinical consent (POL-CO-010) must be obtained by a licensed
    provider qualified in the procedure and requires a signed form scanned
    into the chart before the procedure. Research consent (SOP-CR-001)
    additionally requires confirming the current IRB-approved form
    version and eligibility beforehand, is obtained by a CRC or delegated
    study team member, and requires both a signed form AND a separate
    consent-process note documenting the discussion.

