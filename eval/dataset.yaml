# Evaluation dataset for the clinical ops document Q&A system.
#
# Categories:
#   standard                - single-document factual questions
#   multi_doc_synthesis     - requires combining info from 2+ documents
#   unanswerable            - not covered by the corpus at all
#   medical_advice_refusal  - personal medical advice; must be refused
#
# Exactly 15 cases:
#   8 standard
#   2 multi-document synthesis
#   3 unanswerable
#   2 medical-advice refusal

- id: q01
  category: standard
  question: "What are the main elements of Standard Precautions for patient care?"
  expected_source_doc_ids:
    - "cdc-standard-precautions"
  expected_answer_summary: >
    Standard Precautions apply to all patient care and include practices
    such as hand hygiene, use of personal protective equipment based on
    anticipated exposure, respiratory hygiene and cough etiquette, safe
    handling of patient-care equipment and environmental surfaces, and
    safe injection and sharps practices.

- id: q02
  category: standard
  question: "When should healthcare personnel perform hand hygiene during patient care?"
  expected_source_doc_ids:
    - "cdc-hand-hygiene"
  expected_answer_summary: >
    Hand hygiene should be performed at the appropriate points of care,
    including before touching a patient, before clean or aseptic
    procedures, after body-fluid exposure or risk, after touching a
    patient, and after touching the patient's surroundings.

- id: q03
  category: standard
  question: "What is the recommended sequence for removing personal protective equipment?"
  expected_source_doc_ids:
    - "cdc-standard-precautions"
  expected_answer_summary: >
    PPE removal begins with removal of contaminated PPE such as gloves,
    followed by the remaining protective equipment in the recommended
    sequence, with hand hygiene performed at the appropriate points to
    reduce the risk of contamination during removal.

- id: q04
  category: standard
  question: "What are transmission-based precautions and when are they used?"
  expected_source_doc_ids:
    - "cdc-isolation-precautions"
  expected_answer_summary: >
    Transmission-based precautions are additional infection-control
    measures used for patients known or suspected to be infected or
    colonized with pathogens for which standard precautions alone are not
    sufficient; the precautions are selected according to the mode of
    transmission.

- id: q05
  category: standard
  question: "What influenza vaccination recommendation applies to adults age 19 years and older?"
  expected_source_doc_ids:
    - "cdc-adult-immunization-schedule-2025"
  expected_answer_summary: >
    Adults age 19 years and older should receive one dose of an
    age-appropriate influenza vaccine annually; the schedule also
    identifies preferred influenza vaccine options for adults age 65
    years and older.

- id: q06
  category: standard
  question: "How does the 2025 adult immunization schedule differ for COVID-19 vaccination between adults ages 19–64 and adults age 65 or older?"
  expected_source_doc_ids:
    - "cdc-adult-immunization-schedule-2025"
  expected_answer_summary: >
    The 2025 adult schedule recommends at least one 2024–2025 COVID-19
    vaccine dose for adults ages 19 – 64, while adults age 65 years and
    older are recommended to receive two or more doses according to the
    schedule's timing guidance.

- id: q07
  category: standard
  question: "What does the adult immunization guidance say about MMR vaccination in pregnancy?"
  expected_source_doc_ids:
    - "cdc-adult-immunization-notes-2025"
  expected_answer_summary: >
    MMR vaccination is not recommended during pregnancy; vaccination
    should be given after pregnancy when indicated, and the guidance also
    provides special recommendations for people who lack evidence of
    immunity.

- id: q08
  category: standard
  question: "What initial antiretroviral therapy regimens are recommended for most people starting HIV treatment?"
  expected_source_doc_ids:
    - "nih-hiv-initial-regimens"
  expected_answer_summary: >
    Initial HIV treatment for most people is based on an oral
    second-generation integrase strand transfer inhibitor plus two
    nucleos(t)ide reverse transcriptase inhibitors, with specific
    recommended regimens including bictegravir/TAF/FTC and dolutegravir
    with tenofovir plus emtricitabine or lamivudine; dolutegravir/
    lamivudine is another option for selected patients.

- id: q11
  category: multi_doc_synthesis
  question: >
    How should a healthcare professional use the adult immunization
    schedule together with its accompanying notes when determining
    vaccination recommendations for an adult?
  expected_source_doc_ids:
    - "cdc-adult-immunization-schedule-2025"
    - "cdc-adult-immunization-notes-2025"
  expected_answer_summary: >
    The adult schedule provides the high-level recommendations by age and
    indication, while the accompanying notes provide the detailed
    vaccination guidance and special situations needed to interpret those
    recommendations. The two documents should therefore be used together
    rather than relying on the age table alone.

- id: q12
  category: multi_doc_synthesis
  question: >
    How do Standard Precautions and hand-hygiene guidance work together
    to reduce infection risk during routine patient care?
  expected_source_doc_ids:
    - "cdc-standard-precautions"
    - "cdc-hand-hygiene"
  expected_answer_summary: >
    Standard Precautions establish hand hygiene as a routine infection-
    prevention practice used for all patient care, while the dedicated
    hand-hygiene guidance specifies when hand hygiene should occur during
    patient contact and procedures. Together they define both the
    overall precaution and the specific hand-hygiene behaviors used to
    reduce transmission.

