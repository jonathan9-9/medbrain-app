name: CI

on: [push]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Type check
        working-directory: backend
        run: mypy .

      - name: Test
        working-directory: backend
        run: pytest
